name: scirider_mobile
description: "SCiRIDER Mobile Application"

publish_to: 'none'

# ============================================================
# APPLICATION VERSION
# ============================================================
#
# Version Name : 2.0.0
# Build Number : 2
#
# Android:
# versionName = 2.0.0
# versionCode = 2
#
# ============================================================

version: 2.0.0+2


# ============================================================
# DART SDK
# ============================================================

environment:
  sdk: ^3.13.2


# ============================================================
# DEPENDENCIES
# ============================================================

dependencies:
  flutter:
    sdk: flutter

  # ----------------------------------------------------------
  # UI
  # ----------------------------------------------------------
  cupertino_icons: ^1.0.8

  # ----------------------------------------------------------
  # HTTP / REST API
  # ----------------------------------------------------------
  http: ^1.6.0

  # ----------------------------------------------------------
  # SECURE STORAGE
  #
  # Used for securely storing the JWT authentication token.
  # ----------------------------------------------------------
  flutter_secure_storage: ^11.0.0

  # ----------------------------------------------------------
  # FILE / PDF OPENING
  #
  # Used for opening downloaded PR / SR / NFA / PO PDFs
  # and other supported documents.
  # ----------------------------------------------------------
  open_filex: ^4.7.0

  # ----------------------------------------------------------
  # LOCAL FILE STORAGE
  #
  # Used for storing temporary downloaded PDF/document files.
  # ----------------------------------------------------------
  path_provider: ^2.1.6

  # ----------------------------------------------------------
  # UPDATE POPUP
  #
  # Used to remember whether an application update popup
  # has already been shown.
  # ----------------------------------------------------------
  shared_preferences: ^2.5.3

  # ----------------------------------------------------------
  # APPLICATION VERSION INFORMATION
  #
  # Used for application version/build information.
  # ----------------------------------------------------------
  package_info_plus: ^10.2.1


# ============================================================
# DEVELOPMENT DEPENDENCIES
# ============================================================

dev_dependencies:
  flutter_test:
    sdk: flutter

  # ----------------------------------------------------------
  # FLUTTER LINT RULES
  # ----------------------------------------------------------
  flutter_lints: ^6.0.0

  # ----------------------------------------------------------
  # APPLICATION ICON GENERATOR
  # ----------------------------------------------------------
  flutter_launcher_icons: ^0.14.4


# ============================================================
# FLUTTER CONFIGURATION
# ============================================================

flutter:

  # Enables Material Design icons.
  uses-material-design: true

  # ----------------------------------------------------------
  # APPLICATION ASSETS
  # ----------------------------------------------------------

  assets:
    - assets/images/stride_logo.png
    - assets/images/stride_favicon.png


# ============================================================
# SCIRIDER APPLICATION ICON
# ============================================================

flutter_launcher_icons:

  # Generate Android launcher icon.
  android: true

  # Keep iOS icon configuration ready for future iOS build.
  ios: true

  # SCiRIDER application icon.
  image_path: "assets/images/stride_favicon.png"

  # Remove alpha channel for future iOS compatibility.
  remove_alpha_ios: true